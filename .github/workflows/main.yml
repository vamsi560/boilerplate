name: Terraform Validation

on:
  push:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Run Terraform Validation
        run: |
          chmod +x validate_tf.sh
          ./validate_tf.sh
      
      - name: Configure Git
        run: |
          git config --global user.email "vamsi.sapireddy@outlook.com"
          git config --global user.name "vamsi560"

      - name: Commit Validation Results
        run: |
          git add validation_results.txt
          git commit -m "Add validation results"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
