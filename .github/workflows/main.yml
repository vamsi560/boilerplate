name: Terraform Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: List Terraform Files
      run: |
        echo "Terraform files in repository:"
        find . -name "*.tf" -type f

    - name: Display Boilerplate Rules
      run: |
        echo "Contents of boilerplate-rules.json:"
        cat boilerplate-rules.json

    - name: Download PowerShell script from Azure Blob Storage
      run: |
        curl -o validate-terraform-boilerplate.ps1 "https://boilerplateps1.blob.core.windows.net/scripts/validate-terraform-boilerplate.ps1?sp=r&st=2024-09-12T09:54:49Z&se=2024-09-12T17:54:49Z&spr=https&sv=2022-11-02&sr=b&sig=DZj6wILW9qjKfwhPFBgjbdfkhHJ2NLxCqY1QC4Gbpss%3D"
        
    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y powershell
        pwsh -v
    
    - name: Run the PowerShell script
      run: |
        pwsh ./validate-terraform-boilerplate.ps1

    - name: Display Validation Report
      run: |
        echo "Contents of terraform-validation-report.md:"
        cat terraform-validation-report.md

    - name: Commit and push if there are changes
      run: |
        git config --global user.email "vamsi.sapireddy@outlook.com"
        git config --global user.name "vamsi560"
        git pull
        git add terraform-validation-report.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Add/Update Terraform validation report" && git push)
          
